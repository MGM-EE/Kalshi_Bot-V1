[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kalshi-research-bot"
version = "0.1.0"
description = "Paper-only, receipt-time-driven Kalshi crypto research bot"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<0.29", "websockets>=15,<16", "cryptography>=44,<47", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pyarrow>=19,<24"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]

[project.scripts]
kalshi-bot = "kalshi_bot.cli:main"

[tool.setuptools.packages.find]
include = ["kalshi_bot*"]

[tool.setuptools.package-data]
kalshi_bot = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
